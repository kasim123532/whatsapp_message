services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - backend-sessions:/app/sessions
      - backend-data:/app/data
    environment:
      - PORT=5000
      - DATABASE_URL=file:/app/data/database.db
      - NODE_ENV=production
      # Campaign working hours and daily send limits follow this clock. Without
      # it the container runs on UTC and every send window is silently shifted.
      - TZ=${TZ:-Asia/Almaty}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4628:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-sessions:
  backend-data:
