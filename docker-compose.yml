services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - backend-sessions:/app/sessions
      - backend-data:/app/data
    environment:
      - PORT=5000
      - DATABASE_URL=file:/app/data/database.db
      - NODE_ENV=production
      # Campaign working hours and daily send limits follow this clock. Without
      # it the container runs on UTC and every send window is silently shifted.
      - TZ=${TZ:-Asia/Almaty}
    restart: always
    healthcheck:
      # node:20-slim has no curl/wget — use node's own fetch against /health.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||5000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4628:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend-sessions:
  backend-data:
